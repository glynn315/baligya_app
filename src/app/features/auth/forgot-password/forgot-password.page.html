<ion-content [fullscreen]="true">
  <div class="shell">
    <div class="back-bar container-tight">
      <a routerLink="/auth/login" class="back-link tap" aria-label="Back">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </a>
    </div>

    <app-brand-header
      [compact]="true"
      title="Reset your password"
      subtitle="Enter your email and we'll send a reset link.">
    </app-brand-header>

    <div class="container-tight">
      <ng-container *ngIf="!sent(); else successTpl">
        <form [formGroup]="form" (ngSubmit)="submit()" class="form-stack">
          <div class="field">
            <ion-input
              label="Email"
              labelPlacement="stacked"
              type="email"
              inputmode="email"
              formControlName="email"
              placeholder="you@store.com"
              autocomplete="email">
              <ion-icon slot="start" name="mail-outline"></ion-icon>
            </ion-input>
          </div>

          <ion-button expand="block" class="brand-btn" type="submit" [disabled]="submitting()">
            <ion-spinner *ngIf="submitting()" name="crescent" class="mr-2"></ion-spinner>
            <span>{{ submitting() ? 'Sending…' : 'Send reset link' }}</span>
          </ion-button>
        </form>
      </ng-container>

      <ng-template #successTpl>
        <div class="success-block">
          <div class="success-icon">
            <ion-icon name="checkmark-circle-outline"></ion-icon>
          </div>
          <h2>Check your inbox</h2>
          <p>If that email is registered, a password reset link is on its way.</p>
          <ion-button expand="block" routerLink="/auth/login" class="brand-btn-outline">
            Back to sign in
          </ion-button>
        </div>
      </ng-template>
    </div>
  </div>
</ion-content>
